@if (filePath()) {
<div class="flex justify-end border-b border-line px-6 py-3 md:px-8">
  <a class="btn" [href]="filePath()">
    <span class="material-symbols-outlined !text-base">download</span>Télécharger</a>
</div>
}

<div class="cell-body">
  @if (type() === 'md') {
  <markdown class="md-content" mermaid [src]="path()" (error)="handleError($event)"></markdown>
  }
  @else if (type() === 'html') {
  <iframe [src]="safePath()" style="width: 100%; min-height: 800px; border: 1px solid var(--line);">
  </iframe>
  }
</div>
