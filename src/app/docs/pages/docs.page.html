<section>
  <div class="eyebrow">
    <div class="eyebrow-inner">
      <p class="hud-label text-muted"><span class="text-faint">01</span><span class="mx-2 text-faint">/</span>Documents
      </p>
      <p class="hud-label hidden text-faint sm:block">Notes & analyses</p>
    </div>
  </div>

  <div class="container-x">
    <div class="grid-lines">

      <div class="cell">
        <div class="cell-head">
          <p class="hud-label text-muted"><span class="text-faint">01</span><span class="mx-2 text-faint">/</span>Liste des
            documents</p>
        </div>
        <ul>
          @for (file of files; track $index) {
          <li class="border-b border-line last:border-b-0">
            <a [routerLink]="['/documents', file.src]"
              class="cell-row flex items-center gap-2 transition-colors hover:bg-invert-bg hover:text-invert-fg">
              @if (selectedDoc()?.src === file.src) {
              <span class="material-symbols-outlined !text-base">folder_open</span>
              } @else {
              <span class="material-symbols-outlined !text-base">folder</span>
              }
              <span>{{ file.name }}</span>
            </a>
          </li>
          }
        </ul>
      </div>

      @if (selectedDoc()) {
      <div class="cell overflow-x-auto">
        <app-post [doc]="selectedDoc()!" />
      </div>
      }

    </div>
  </div>
</section>
